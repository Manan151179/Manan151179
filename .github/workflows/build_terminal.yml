name: Generate Terminal SVG

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch: # Allows manual trigger
  push:
    branches:
      - main

# ---------------------------------------------
# THE FIX: Explicitly grant write permissions
# so the bot can commit the SVG back to the repo
# ---------------------------------------------
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # Updated to clear Node 20 warning

      - name: Set up Python
        uses: actions/setup-python@v5 # Updated to clear Node 20 warning
        with:
          python-version: '3.x'

      - name: Generate SVG
        run: python generate_terminal.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terminal.svg
          git commit -m "Auto-generated ML terminal SVG" || exit 0
          git push
